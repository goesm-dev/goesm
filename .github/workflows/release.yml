name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: npm ci --prefix test
      - run: go test ./...
        env:
          GOESM_REQUIRE_OXLINT: "1"
  # Creates a draft GitHub release with generated notes; edit and publish it
  # by hand. goesm is installed with go install, so no binaries are attached.
  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: >-
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          --verify-tag --draft --generate-notes
          $(case "$GITHUB_REF_NAME" in *-*) echo --prerelease;; esac)
        env:
          GH_TOKEN: ${{ github.token }}
