name: ci
on:
  # Branches run through their pull requests; main runs on push, which also
  # refreshes the caches pull requests restore.
  push:
    branches: [main]
  pull_request:
  workflow_call:
# Pull requests are grouped by number, not github.ref: a pull_request event
# that arrives after the merge gets refs/heads/main as its ref, and its
# cancel-in-progress cancelled main's push run (#75, #76).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Go, Node and Bun at the versions pinned in mise.toml.
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.0
      # Go's module and build caches and npm's: the key changes with every
      # commit, and restore-keys picks up the latest earlier one.
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.npm
          key: test-${{ runner.os }}-${{ hashFiles('mise.toml', 'go.sum', 'test/package-lock.json') }}-${{ github.sha }}
          restore-keys: test-${{ runner.os }}-${{ hashFiles('mise.toml', 'go.sum', 'test/package-lock.json') }}-
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: npm ci --prefix test
      - run: go test ./...
        env:
          GOESM_REQUIRE_TOOLS: "1"
  otelc:
    # OpenTelemetry's compile-time instrumentation through goesm -toolexec,
    # against a native build (docs/otelc.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.0
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: otelc-${{ runner.os }}-${{ hashFiles('mise.toml', 'go.sum') }}-${{ github.sha }}
          restore-keys: otelc-${{ runner.os }}-${{ hashFiles('mise.toml', 'go.sum') }}-
      - run: go install go.opentelemetry.io/otelc/tool/cmd/otelc@v1.1.0
        env:
          GOBIN: ${{ runner.temp }}/otelc
      - run: go test ./test -run TestOtelc -v -timeout 20m
        env:
          GOESM_TEST_OTELC: ${{ runner.temp }}/otelc/otelc
  conformance:
    # Go's own test/ directory (`// run` tests) through goesm, against the
    # baseline in test/conformance/passing.txt.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # mise installs the full Go distribution, which includes GOROOT/test.
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.0
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: conformance-${{ runner.os }}-${{ hashFiles('mise.toml', 'go.sum') }}-${{ github.sha }}
          restore-keys: conformance-${{ runner.os }}-${{ hashFiles('mise.toml', 'go.sum') }}-
      - run: go test ./test -run TestGoConformance -v -timeout 30m
        env:
          GOESM_CONFORMANCE: "1"
