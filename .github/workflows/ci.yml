name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: npm ci --prefix test
      - run: go test ./...
        env:
          GOESM_REQUIRE_OXLINT: "1"
  conformance:
    # Go's own test/ directory (`// run` tests) through goesm, against the
    # baseline in test/conformance/passing.txt.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: go test ./test -run TestGoConformance -v -timeout 30m
        env:
          GOESM_CONFORMANCE: "1"
