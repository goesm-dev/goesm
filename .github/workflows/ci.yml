name: ci
on:
  push:
  pull_request:
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Go, Node and Bun at the versions pinned in mise.toml.
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.0
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: npm ci --prefix test
      - run: go test ./...
        env:
          GOESM_REQUIRE_OXLINT: "1"
