# Release builds of the goesm command. Run by .github/workflows/release.yml
# when a v* tag is pushed; see docs/releasing.md.
version: 2

project_name: goesm

builds:
  - id: goesm
    main: ./cmd/goesm
    binary: goesm
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: goesm
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

release:
  # v0.0.1-beta.N and other semver prereleases are marked as prereleases.
  prerelease: auto
